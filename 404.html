<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
        // Redirigir todas las 404 a index.html para que React Router maneje las rutas
        const pathname = globalThis.location.pathname;
        const basePath = '/MyCustomToDo';
        let targetPath = basePath + '/index.html?redirect=' + encodeURIComponent(pathname);
        
        globalThis.location.replace(targetPath);
    </script>
</head>
<body>
    <p>Redirigiendo...</p>
</body>
</html>
